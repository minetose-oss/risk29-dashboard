name: Update Dashboard Data (Simple)

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Update dashboard data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # ตรวจสอบว่า script อยู่ที่ไหน (บางทีอาจอยู่ใน root หรือ scripts/)
          if [ -f "scripts/update_dashboard_simple.py" ]; then
            python scripts/update_dashboard_simple.py
          elif [ -f "update_dashboard_simple.py" ]; then
            python update_dashboard_simple.py
          else
            echo "❌ Error: update_dashboard_simple.py not found!"
            ls -R
            exit 1
          fi
      
      - name: Verify generated files
        run: |
          echo "📁 Checking generated files..."
          ls -lh client/public/risk_data.json || echo "⚠️ risk_data.json missing"
          ls -lh client/public/historical_data.json || echo "⚠️ historical_data.json missing"
          ls -lh client/public/predictions.json || echo "⚠️ predictions.json missing"
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          
          # Add only the JSON files we care about
          git add client/public/risk_data.json
          git add client/public/historical_data.json
          git add client/public/predictions.json
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update dashboard data $(date +'%Y-%m-%d %H:%M UTC')"
            git push origin master
            echo "✅ Changes committed and pushed successfully!"
          else
            echo "ℹ️ No changes to commit"
          fi
